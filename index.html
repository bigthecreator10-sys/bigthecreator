<!-- PORTFOLIO -->

<section class="portfolio" id="portfolio">
  <div class="container">

    <div class="section-heading">
      <small>My Work</small>

      <h2>Portfolio Gallery</h2>

      <p class="portfolio-note">
        Showcase your creative work, events, branding,
        graphics and videos.
      </p>
    </div>

    <!-- ADD YOUR WORK -->

    <input
      type="file"
      id="workUpload"
      accept="image/*,video/*"
      multiple
      hidden
    >

    <button
      type="button"
      class="upload-work-btn"
      onclick="document.getElementById('workUpload').click()"
    >
      <span class="upload-plus">+</span>

      <span>
        <strong>Add Your Work</strong>
        <small>Choose photos or videos from your gallery</small>
      </span>
    </button>

    <div
      id="uploadMessage"
      class="upload-message"
    ></div>

    <!-- PORTFOLIO GALLERY -->

    <div
      class="portfolio-grid"
      id="portfolioGrid"
    >

      <div class="portfolio-empty">
        Your work will appear here.
        Tap <strong>Add Your Work</strong> to select your media.
      </div>

    </div>

  </div>
</section>
